name: Crear carpetas (DIGI storage vía WebDAV)

# El cron nativo de GitHub ('*/5 * * * *') no es fiable en repos poco activos (se han visto
# huecos de varias horas entre ejecuciones). Por eso esta tarea ahora corre también como parte
# de "Procesar pedidos Notion -> Discord" (procesar-pedidos.yml), que sí se dispara cada 5 min
# de verdad vía cron-job.org. Este workflow se deja solo para lanzarlo a mano si hace falta.
on:
  workflow_dispatch: {}

jobs:
  crear-carpetas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node pasos/crear-carpetas-cloud.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DIGISTORAGE_USER: ${{ secrets.DIGISTORAGE_USER }}
          DIGISTORAGE_WEBDAV_PASSWORD: ${{ secrets.DIGISTORAGE_WEBDAV_PASSWORD }}
      - name: Avisar por Discord si la ejecución falla
        if: failure()
        run: |
          curl -s -X POST "https://discord.com/api/v10/channels/${{ secrets.DISCORD_ALERT_CHANNEL_ID }}/messages" \
            -H "Authorization: Bot ${{ secrets.DISCORD_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ La automatización de carpetas (DIGI storage) ha fallado. Revisa el detalle aquí: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

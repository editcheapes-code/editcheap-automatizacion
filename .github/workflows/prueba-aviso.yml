name: Prueba de aviso de fallo (temporal)

on:
  workflow_dispatch: {}

jobs:
  fallar-a-proposito:
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
      - name: Avisar por Discord si la ejecución falla
        if: failure()
        run: |
          curl -s -X POST "https://discord.com/api/v10/channels/${{ secrets.DISCORD_ALERT_CHANNEL_ID }}/messages" \
            -H "Authorization: Bot ${{ secrets.DISCORD_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ Esto es solo una PRUEBA del sistema de avisos, todo funciona bien.\"}"

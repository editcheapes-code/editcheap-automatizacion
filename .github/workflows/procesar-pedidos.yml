name: Procesar pedidos Notion -> Discord

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  procesar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node pasos/procesar-pedidos.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_APPS_SCRIPT_SECRET: ${{ secrets.GOOGLE_APPS_SCRIPT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: npm install
      - run: node pasos/crear-carpetas-cloud.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DIGISTORAGE_USER: ${{ secrets.DIGISTORAGE_USER }}
          DIGISTORAGE_WEBDAV_PASSWORD: ${{ secrets.DIGISTORAGE_WEBDAV_PASSWORD }}
      - name: Avisar por Discord si la ejecución falla
        if: failure()
        run: |
          curl -s -X POST "https://discord.com/api/v10/channels/${{ secrets.DISCORD_ALERT_CHANNEL_ID }}/messages" \
            -H "Authorization: Bot ${{ secrets.DISCORD_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ La automatización de EDITCHEAP ha fallado. Revisa el detalle aquí: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

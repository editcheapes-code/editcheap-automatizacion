name: TEMP - Auditoria Discord

on:
  workflow_dispatch: {}

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node pasos/_temp-check-rollup.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
